###############################################################################
# mediamtx configuration for equip-1 companion
# Minimal config: allow any source to publish, enable WebRTC/WHEP
###############################################################################

# Accept any path for both publishing and subscribing
paths:
  all_others:

# WebRTC / WHEP
# Signaling stays loopback-only (proxied by companion-api on :8000); the
# ICE UDP port must stay LAN-facing or WebRTC media can't reach a phone.
webrtcAddress: 127.0.0.1:8889
webrtcEncryption: no
webrtcLocalUDPAddress: :8189

# RTSP: loopback-only, not meant to be reachable directly from the LAN.
rtspAddress: 127.0.0.1:8554

# Logging
logLevel: error
